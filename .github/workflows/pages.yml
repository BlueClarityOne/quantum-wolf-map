# Deploys the static site to GitHub Pages.
# The site is served from https://blueclarityone.github.io/quantum-wolf-map/
# Asset paths in the HTML are relative so they resolve under that subpath.
# If this workflow cannot enable Pages by itself, set
# Settings > Pages > Build and deployment > Source to GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html research.html favicon.png share.png _site/
          cp -a assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
